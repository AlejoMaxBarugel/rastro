<h1>Rastro</h1>
<h2>{% if alumno %}Editar alumno{% else %}Nuevo alumno{% endif %}</h2>

{% if messages %}{% for message in messages %}<p style="color: red;">{{ message }}</p>{% endfor %}{% endif %}

<form method="post">
    {% csrf_token %}
    <input type="hidden" name="solo_refrescar" id="solo-refrescar" value="">

    <label>Nombre</label><br>
    <input type="text" name="nombre" value="{{ alumno.nombre|default:'' }}"><br><br>

    <label>Apellido</label><br>
    <input type="text" name="apellido" value="{{ alumno.apellido|default:'' }}"><br><br>

    <label>DNI</label><br>
    <input type="text" name="dni" value="{{ alumno.dni|default:'' }}"><br><br>

    <label>Grado</label><br>
    <select name="id_grado" onchange="document.getElementById('solo-refrescar').value='1'; this.form.submit()">
        {% for g in grados %}
        <option value="{{ g.id_grado }}" {% if grado_sel == g.id_grado or alumno.grado_id == g.id_grado %}selected{% endif %}>{{ g.nombre_grado }}</option>
        {% endfor %}
    </select><br><br>

    <label>División</label><br>
    <select name="id_division">
        {% for d in divisiones %}
        <option value="{{ d.id_division }}" {% if alumno.division_id == d.id_division %}selected{% endif %}>{{ d.nombre_division }}</option>
        {% endfor %}
    </select><br><br>

    <label>Turno</label><br>
    <select name="id_turno">
        {% for t in turnos %}
        <option value="{{ t.id_turno }}" {% if alumno.turno_id == t.id_turno %}selected{% endif %}>{{ t.nombre_turno }}</option>
        {% endfor %}
    </select><br><br>

    <label>Estado</label><br>
    <select name="estado">
        <option value="ACTIVO" {% if alumno.estado == "ACTIVO" %}selected{% endif %}>ACTIVO</option>
        <option value="INACTIVO" {% if alumno.estado == "INACTIVO" %}selected{% endif %}>INACTIVO</option>
        <option value="EGRESADO" {% if alumno.estado == "EGRESADO" %}selected{% endif %}>EGRESADO</option>
        <option value="BAJA" {% if alumno.estado == "BAJA" %}selected{% endif %}>BAJA</option>
    </select><br><br>

    <button type="submit">Guardar</button>
    {% if alumno %}<a href="{% url 'alumno_eliminar' alumno.id_alumno %}">Eliminar</a>{% endif %}
</form>

<p><a href="{% url 'directivo_alumnos' %}">&larr; Volver</a></p>
